<html lang="en" data-theme="deck">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ── Sign in ─────────────────────────────────────────── -->
<div id="login-overlay" class="login-screen hidden">
  <div class="login-card">
    <div class="login-mark"><svg><use href="#i-bolt"/></svg></div>
    <p class="kicker">Customer Success</p>
    <h1 class="login-title">SUCCESS<span>//</span>DECK</h1>
    <p class="muted">One console for your data, your inbox and your board.</p>
    <label>Operator name<input id="login-name" placeholder="Alex Doe" autocomplete="name"></label>
    <label>Work email<input id="login-email" placeholder="alex@company.com" autocomplete="email"></label>
    <button id="login-btn" class="primary block lg">Enter console <svg><use href="#i-bolt"/></svg></button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<!-- ── App shell ───────────────────────────────────────── -->
<div id="shell" class="shell hidden">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-bolt"/></svg></span>
      <span class="brand-text">SUCCESS<span class="slash">//</span>DECK</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="chat"><svg class="ico"><use href="#i-chat"/></svg><span>Console</span></button>
      <button class="nav-item" data-view="tickets"><svg class="ico"><use href="#i-ticket"/></svg><span>Board</span><span id="nav-ticket-count" class="pill"></span></button>
      <button class="nav-item" data-view="sources"><svg class="ico"><use href="#i-plug"/></svg><span>Sources</span><span id="nav-source-count" class="pill"></span></button>
      <button class="nav-item" data-view="reports"><svg class="ico"><use href="#i-doc"/></svg><span>Output</span></button>
    </nav>

    <div class="topbar-right">
      <button id="settings-btn" class="icon-btn" title="Settings — API keys and credentials"><svg><use href="#i-cog"/></svg></button>
      <button id="theme-btn" class="icon-btn" title="Toggle theme"><svg><use href="#i-sun"/></svg></button>
      <button id="logout-btn" class="icon-btn" title="Sign out"><svg><use href="#i-exit"/></svg></button>
      <span class="who">
        <span id="who-avatar" class="avatar"></span>
        <span class="who-text"><strong id="who-name"></strong><small id="who-email"></small></span>
      </span>
    </div>
  </header>

  <main class="main">

    <section id="view-chat" class="view active">
      <div class="view-head">
        <div><p class="kicker">Console</p><h1>Ask the deck</h1></div>
        <button id="chat-reset" class="ghost">Reset thread</button>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <div id="chat-suggestions" class="suggestions"></div>
      <form id="chat-form" class="composer">
        <span class="prompt-caret">&gt;</span>
        <textarea id="chat-input" rows="1" placeholder="query customers, inbox, tickets…"></textarea>
        <button type="submit" id="chat-send" class="primary send-btn" title="Send"><svg><use href="#i-send"/></svg></button>
      </form>
    </section>

    <section id="view-tickets" class="view">
      <div class="view-head">
        <div><p class="kicker">Board</p><h1>Tickets</h1></div>
        <div class="head-actions">
          <span class="search-wrap"><svg class="search-ico"><use href="#i-search"/></svg>
            <input id="ticket-search" class="search" placeholder="filter…"></span>
          <button id="ticket-new" class="primary"><svg><use href="#i-plus"/></svg>New</button>
        </div>
      </div>
      <div id="sync-bar" class="sync-bar"></div>
      <div id="board" class="board"></div>
    </section>

    <section id="view-sources" class="view">
      <div class="view-head">
        <div><p class="kicker">Sources</p><h1>Connected data</h1></div>
        <button id="source-new" class="primary"><svg><use href="#i-plus"/></svg>Connect</button>
      </div>
      <div id="setup-panel" class="setup-panel hidden"></div>
      <div id="source-list" class="source-list"></div>
    </section>

    <section id="view-reports" class="view">
      <div class="view-head">
        <div><p class="kicker">Output</p><h1>Reports &amp; decks</h1></div>
      </div>
      <div id="artifact-list" class="artifact-list"></div>
    </section>

  </main>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script src="/ui.js?v=8"></script>
</body>
</html>
